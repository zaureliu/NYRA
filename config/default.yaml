environment: development
host: 127.0.0.1
backend_port: 8000
frontend_port: 5173
log_level: INFO
database_path: data/nyra.db
llm_provider: ollama
llm_model: qwen3:8b
ollama_url: http://127.0.0.1:11434
llm_timeout_seconds: 180
ollama_preload: true
ollama_keep_alive: "1h"
ollama_warmup: true
ollama_context_size: 8192
ollama_preload_timeout_seconds: 300
ollama_recovery_interval_seconds: 10
ollama_unload_previous_model: true
stt_provider: faster_whisper
stt_model: tiny
stt_device: cpu
stt_compute_type: int8
stt_language: pt
stt_beam_size: 1
stt_cpu_threads: 4
stt_workers: 1
silence_threshold: 0.018
tts_provider: edge_tts
# Provider layer V1 is independent from the legacy Voice Lab engine above.
# Online voice is strictly opt-in and never contacted while disabled.
tts_provider_id: local
tts_provider_fallback: local
tts_online_enabled: false
tts_local_engine: kokoro
tts_openai_model: gpt-4o-mini-tts
tts_openai_voice: coral
tts_elevenlabs_model: eleven_multilingual_v2
tts_elevenlabs_voice_id: ""
tts_online_timeout_seconds: 30
edge_tts_enabled: true
edge_tts_default_locale: pt-BR
edge_tts_gender_filter: Female
edge_tts_timeout_seconds: 30
pronunciation_enabled: true
pronunciation_provider_overrides: true
pronunciation_normalize_technical_numbers: true
pronunciation_read_full_urls: false
pronunciation_read_full_paths: false
pronunciation_unknown_detection: true
pronunciation_debug: false
adult_mode_enabled: false
tts_language: pt-BR
tts_model_path: data/models/kokoro-v1.0.int8.onnx
tts_voices_path: data/models/voices-v1.0.bin
tts_voice: en-US-AvaMultilingualNeural
tts_voice_identity_version: ava-v1
tts_speaking_rate: 0.97
tts_fallback_provider: pyttsx3
chatterbox_python: .venv-chatterbox/Scripts/python.exe
chatterbox_device: cpu
chatterbox_reference: data/voices/nyra_reference.wav
microphone: default
speaker: default
audio_volume: 0.9
mic_gain: 1.0
mic_preroll_ms: 250
mic_postroll_ms: 850
voice_speech_start_ms: 100
voice_max_utterance_seconds: 60
vad_enabled: true
vad_threshold: 0.5
vad_min_speech_ms: 250
vad_min_silence_ms: 650
vad_speech_pad_ms: 250
keep_debug_audio: false
always_listening_enabled: true
listening_mode: hands_free
wake_word: Nyra
hands_free_timeout_seconds: 120
listening_guard_ms: 400
listening_privacy_indicator: true
listening_audio_debug: false
conversation_engine: true
voice_barge_in: true
voice_stream_tts: true
voice_emotion_mode: automatic
voice_expressiveness: normal
network_watch_enabled: false
network_voice_alerts: true
network_desktop_alerts: true
network_quiet_mode: false
network_critical_voice_in_quiet: false
network_interface_interval: 1.0
network_gateway_interval: 2.0
network_internet_interval: 5.0
network_dns_interval: 15.0
network_http_interval: 30.0
network_latency_warning_ms: 100
network_latency_critical_ms: 200
network_packet_loss_warning: 5
network_packet_loss_critical: 15
network_jitter_warning_ms: 40
network_alert_cooldown_seconds: 300
network_history_retention_days: 30
network_dns_target: cloudflare.com
network_internet_targets: 1.1.1.1:443,8.8.8.8:53
shell_enabled: true
shell_default: powershell
shell_timeout_seconds: 30
shell_max_timeout_seconds: 300
shell_max_output_chars: 50000
shell_max_calls_per_turn: 10
shell_confirm_destructive: true
shell_approval_ttl_seconds: 300
shell_default_working_directory: .
remote_shell_enabled: true
ssh_connect_timeout_seconds: 5
ssh_command_timeout_seconds: 30
ssh_max_timeout_seconds: 300
ssh_max_output_chars: 50000
agent_enabled: true
agent_max_steps: 12
agent_max_tool_calls: 20
agent_max_runtime_seconds: 300
agent_read_only: false
agent_auto_remediation: true
agent_auto_remediation_actions: ""
agent_max_identical_repeats: 2
agent_max_consecutive_failures: 3
selfdev_mode: AUTONOMOUS_SAFE
selfdev_model: qwen3:8b
selfdev_workspace: ../Nyra-Auto-Code
selfdev_canonical_root: .
selfdev_public_snapshot: ../NYRA-GitHub-Public
selfdev_run_when_idle: true
selfdev_auto_publish_github: false
selfdev_max_auto_promotions_per_day: 3
selfdev_max_candidate_runtime_minutes: 30
selfdev_max_files_low_risk: 8
selfdev_max_diff_lines_low_risk: 500
selfdev_cooldown_minutes: 15
sentinel_watch_enabled: false
sentinel_auto_discovery: true
sentinel_discovery_interval: 60
sentinel_host: ""
sentinel_port: 5000
sentinel_prefer_manual_host: true
sentinel_voice_alerts: true
sentinel_desktop_alerts: true
sentinel_critical_only: false
sentinel_store_event_history: true
sentinel_create_episodic_memory: false
sentinel_auto_reconnect: true
sentinel_reconnect_backoff: 1,2,5,10,30,60
sentinel_debug_mode: false
sentinel_discovery_allowlist: ""
sentinel_event_retention_days: 30
sentinel_alert_cooldown_seconds: 300
sentinel_disconnect_grace_seconds: 7
desktop_always_on_top: true
desktop_click_through: false
desktop_overlay_scale: 1.0
desktop_speech_bubble: true
desktop_idle_animation: true
desktop_start_with_windows: false
# Operator V2 flags (prompt9 Parte R) — cada flag tem consumer + teste
vision_enabled: true
vision_frame_ttl_seconds: 45
vision_debug_keep_frames: false
browser_control_enabled: true
credential_broker_enabled: true
persistent_jobs_enabled: true
workflow_engine_enabled: true
desktop_watcher_enabled: true
watch_default_ttl_seconds: 300
watchdog_enabled: true
proactive_operator_enabled: false
proactive_presence_enabled: true
proactive_presence_mode: NORMAL
proactive_voice_enabled: false
proactive_presence_cooldown_seconds: 300
proactive_presence_max_per_hour: 6
proactive_presence_defer_ttl_seconds: 1800
elevated_session_default_ttl_seconds: 300
homelab_poll_interval: 60
homelab_mutations_enabled: false
proactive_mode: false
cpu_alert_threshold: 90
memory_alert_threshold: 90
event_cooldown_seconds: 900
memory_retention_days: 90
memory_max_short_term: 40
