    <path d="M177 208Q182 95 310 83q128 12 133 125l-25 178q-20 75-108 92-88-17-108-92z" fill="url(#hair)" stroke="#344650" stroke-width="3"/>
    <path d="M203 184Q310 92 417 184l-17 181q-30 77-90 91-60-14-90-91z" fill="url(#skin)"/>
    <g clip-path="url(#faceClip)" opacity=".16" stroke="#55c9d8"><path d="M210 365h48l14 14h76l14-14h48"/><path d="M240 410h140"/></g>
    <path d="M196 245Q190 132 304 105q-70 70-70 182l-28 95-26-104z" fill="url(#hair)"/><path d="M304 105q113 24 124 129l-31 31q-9-81-93-160" fill="#1b2730"/><path d="M303 106q-13 108-65 164 79-39 112-151" fill="#222f38"/><path d="M350 119q22 80 71 119" stroke="#55c9d8" stroke-width="5" opacity=".65"/>
    <g id="eyeGroup"><g><path class="brow" id="browL" d="M240 273q35-18 61 0" fill="none" stroke="#33292a" stroke-width="8" stroke-linecap="round"/><path class="lid" d="M238 302q32-31 67 0-34 29-67 0" fill="#e8e4df"/><ellipse cx="273" cy="301" rx="13" ry="17" fill="#55c9d8"/><circle cx="273" cy="301" r="7" fill="#18252c"/><circle cx="277" cy="295" r="3" fill="#d8ffff"/><circle cx="273" cy="301" r="11" fill="none" stroke="#9be7ed" opacity=".65"/></g><g><path class="brow" id="browR" d="M319 273q31-18 61 0" fill="none" stroke="#33292a" stroke-width="8" stroke-linecap="round"/><path class="lid" d="M315 302q34-31 68 0-34 29-68 0" fill="#e8e4df"/><ellipse cx="349" cy="301" rx="13" ry="17" fill="#55c9d8"/><circle cx="349" cy="301" r="7" fill="#18252c"/><circle cx="353" cy="295" r="3" fill="#d8ffff"/><circle cx="349" cy="301" r="11" fill="none" stroke="#9be7ed" opacity=".65"/></g></g>
    <path d="M310 309l-9 49 18 3" fill="none" stroke="#8f706d" stroke-width="3" stroke-linecap="round"/>
    <g id="mouths" fill="none" stroke="#563b40" stroke-linecap="round"><path id="mouth_closed" d="M278 395q32 8 64 0" stroke-width="4"/><path id="mouth_small" d="M288 396q22-9 44 0-22 12-44 0" fill="#70474f" stroke-width="3"/><path id="mouth_medium" d="M282 394q28-15 56 0-28 27-56 0" fill="#70474f" stroke-width="3"/><path id="mouth_open" d="M280 390q30-19 60 0-3 39-30 40-27-1-30-40" fill="#38232a" stroke-width="3"/><path d="M291 397q19 8 38 0" stroke="#c78f98"/></g><path id="smile" d="M278 392q32 25 67-2" fill="none" stroke="#563b40" stroke-width="5" stroke-linecap="round"/><path id="concernMouth" d="M284 407q27-18 53 0" fill="none" stroke="#563b40" stroke-width="5" stroke-linecap="round"/><ellipse id="surpriseMouth" cx="310" cy="399" rx="14" ry="19" fill="#38232a" stroke="#563b40" stroke-width="3"/>
    <g transform="translate(423 290)"><path d="M0-35q26 9 26 35v50Q12 72 0 50z" fill="#17232b" stroke="#55c9d8" stroke-width="2"/><circle cx="12" cy="6" r="6" fill="#8d79d6" filter="url(#cyanGlow)"/><path d="M12 15v29" stroke="#55c9d8"/></g>
  </g>
  <g id="voiceBars" opacity="0" fill="#55c9d8"><rect x="278" y="713" width="5" height="12" rx="2"><animate attributeName="height" values="6;18;6" dur=".5s" repeatCount="indefinite"/></rect><rect x="292" y="709" width="5" height="18" rx="2"><animate attributeName="height" values="18;8;18" dur=".42s" repeatCount="indefinite"/></rect><rect x="306" y="705" width="5" height="22" rx="2"><animate attributeName="height" values="10;24;10" dur=".58s" repeatCount="indefinite"/></rect><rect x="320" y="709" width="5" height="18" rx="2"><animate attributeName="height" values="18;6;18" dur=".47s" repeatCount="indefinite"/></rect><rect x="334" y="713" width="5" height="12" rx="2"><animate attributeName="height" values="5;16;5" dur=".53s" repeatCount="indefinite"/></rect></g>
</svg>
