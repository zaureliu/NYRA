<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 760" role="img" aria-labelledby="title desc" data-state="neutral" data-status="idle" data-mouth="mouth_closed">
  <title id="title">NYRA</title><desc id="desc">Avatar vetorial original da assistente de homelab NYRA</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101820"/><stop offset="1" stop-color="#080b0f"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27343e"/><stop offset=".65" stop-color="#111820"/><stop offset="1" stop-color="#080b0f"/></linearGradient>
    <linearGradient id="skin" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#d9c0b8"/><stop offset="1" stop-color="#ad8f8a"/></linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#26343e"/><stop offset="1" stop-color="#0d141b"/></linearGradient>
    <filter id="cyanGlow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="faceClip"><path d="M203 184 Q310 92 417 184 L400 365 Q370 442 310 456 Q250 442 220 365Z"/></clipPath>
  </defs>
  <style>
    #breath{transform-origin:310px 650px;animation:breath 5.4s ease-in-out infinite} @keyframes breath{50%{transform:translateY(-3px) scale(1.006)}}
    #eyeGroup{transform-origin:center;animation:look 9s ease-in-out infinite} @keyframes look{0%,38%,100%{transform:translateX(0)}43%,52%{transform:translateX(3px)}70%,78%{transform:translateX(-2px)}}
    .lid{transform-origin:center;animation:blink 5.7s infinite} @keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}45%,47%{transform:scaleY(.05)}}
    [data-status="listening"] #listenRing{opacity:1;animation:pulse 1.2s ease-out infinite}[data-status="thinking"] #thoughtNodes{opacity:1;animation:pulse 1.6s ease-in-out infinite}[data-status="speaking"] #voiceBars{opacity:1}
    @keyframes pulse{0%{opacity:.25;transform:scale(.96)}50%{opacity:1;transform:scale(1.02)}100%{opacity:.25;transform:scale(.96)}}
    #mouth_small,#mouth_medium,#mouth_open{display:none}[data-mouth="mouth_small"] #mouth_closed{display:none}[data-mouth="mouth_small"] #mouth_small{display:block}[data-mouth="mouth_medium"] #mouth_closed{display:none}[data-mouth="mouth_medium"] #mouth_medium{display:block}[data-mouth="mouth_open"] #mouth_closed{display:none}[data-mouth="mouth_open"] #mouth_open{display:block}
    #smile,#concernMouth,#surpriseMouth{display:none}[data-state="happy"] #mouths,[data-state="amused"] #mouths{display:none}[data-state="happy"] #smile,[data-state="amused"] #smile{display:block}[data-state="concerned"] #mouths{display:none}[data-state="concerned"] #concernMouth{display:block}[data-state="surprised"] #mouths{display:none}[data-state="surprised"] #surpriseMouth{display:block}
    [data-state="concerned"] #browL{transform:rotate(7deg)}[data-state="concerned"] #browR{transform:rotate(-7deg)}[data-state="surprised"] .brow{transform:translateY(-8px)}
  </style>
  <rect width="620" height="760" rx="28" fill="url(#bg)"/><g opacity=".16" stroke="#55c9d8" fill="none"><path d="M22 96h128l28-28h75M598 158H472l-35 35h-42M18 608h113l31 31h82M602 552H491l-44-44h-52"/><circle cx="150" cy="96" r="4" fill="#55c9d8"/><circle cx="472" cy="158" r="4" fill="#55c9d8"/></g>
